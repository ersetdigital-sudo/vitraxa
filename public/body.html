<style>
/* Vitraxa Globals — fuchsia + cyan di atas putih keunguan. Header menempel, tanpa menu mobile. */
:root{
  --display:'Space Grotesk','Figtree',system-ui,sans-serif;
  --font:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --accent:#A21CAF; --on-accent:#fff; --accent-2:#0EA5C6; --violet:#A21CAF; --yellow:#8BE3F5;
  --bg:#F8F5FB; --surface:#FFFFFF; --surface-2:#EFE7F4; --ink:#1B1230; --ink-2:#48395E; --muted:#6A5C7D;
  --line:#E4DDEC; --line-strong:#C9BCD8; --accent-text:#A21CAF; --accent-soft:#F6E3F8;
  --ok:#0F7A55; --ok-soft:#D9F5EB; --warn:#8F5200; --warn-soft:#FFEFCC; --bad:#B42318; --bad-soft:#FDE3E0; --info:#1D4ED8; --info-soft:#E1E9FF;
  --r-sm:12px; --r:18px; --r-lg:24px; --r-xl:32px;
  --gut:16px; --max:1180px; --dock-h:0px; --top-h:68px;
  color-scheme:light;
}
@media (min-width:640px){:root{--gut:28px}}
@media (min-width:1024px){:root{--gut:40px}}

</style>
<style>
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:500 16px/1.6 var(--font);overflow-x:hidden;min-height:100vh;display:flex;flex-direction:column}
body.lock{overflow:hidden}
main{flex:1;min-width:0;outline:none}
h1,h2,h3,h4{margin:0;font-family:var(--display);font-weight:700;letter-spacing:-.03em;line-height:1.15}
p{margin:0}
a{color:inherit;text-decoration:none}
img,svg{display:block;max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
ul,ol{margin:0;padding:0;list-style:none}
code,kbd{font-family:var(--mono)}
:focus-visible{outline:3px solid var(--violet);outline-offset:2px;border-radius:8px}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:fixed;left:12px;top:-60px;z-index:300;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:var(--r-sm);font-weight:700;transition:top .15s}
.skip:focus{top:12px}
.muted{color:var(--muted)}
.ico{flex:none}
.wrap{width:100%;max-width:var(--max);margin-inline:auto;padding-inline:var(--gut)}
.eyebrow{font:500 12px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--accent-text);margin:0 0 14px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

</style>
<style>
/* header menempel penuh; di mobile hanya logo + tombol Pesanan (tanpa menu) */
.top{position:sticky;top:0;z-index:50;background:var(--surface);border-bottom:1.5px solid var(--line)}
.top__in{max-width:var(--max);margin:0 auto;height:var(--top-h);padding:0 var(--gut);display:flex;align-items:center;gap:28px}
.logo{display:inline-flex;align-items:center;gap:10px;min-height:44px}
.logo__word{font-family:var(--display);font-size:21px;letter-spacing:-.03em;display:inline-flex;gap:4px;white-space:nowrap}
.logo__word b{font-weight:800}.logo__word span{font-weight:600;color:var(--accent)}
.top__links{display:none}
.top__r{margin-left:auto;display:flex;align-items:center;gap:8px}
.top__find{display:none}
.icon-btn{width:44px;height:44px;display:inline-grid;place-items:center;border-radius:50%;transition:background .15s}
.icon-btn:hover{background:var(--surface-2)}
@media (min-width:1024px){
  .top__links{display:flex;gap:4px}
  .top__links a{position:relative;display:flex;align-items:center;min-height:68px;padding:0 14px;font-weight:600;font-size:15px;color:var(--ink-2);transition:color .15s}
  .top__links a:hover{color:var(--ink)}
  .top__links a.is-active{color:var(--accent)}
  .top__links a.is-active::after{content:"";position:absolute;left:14px;right:14px;bottom:-1.5px;height:3px;background:var(--accent);border-radius:3px 3px 0 0}
  .top__find{display:flex;align-items:center;gap:8px;height:44px;padding:0 14px;border:1.5px solid var(--line-strong);border-radius:12px;color:var(--muted);background:var(--bg)}
  .top__find kbd{font-size:11px;border:1px solid var(--line-strong);border-radius:5px;padding:1px 6px}
  .top__find:hover{border-color:var(--ink);color:var(--ink)}
}
/* footer */
.site-footer{margin-top:88px;padding:56px 0 32px;background:var(--surface);border-top:1.5px solid var(--line)}
.ft{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:32px 24px}
.ft__a{grid-column:1/-1}.ft__a p{margin-top:12px;color:var(--muted);max-width:36ch;font-size:15px}
.ft h3{font:700 13px var(--font);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:14px}
.ft li{margin-bottom:9px;font-size:15px;color:var(--ink-2);overflow-wrap:anywhere}
.ft a:hover{color:var(--accent);text-decoration:underline}
@media (min-width:900px){.ft{grid-template-columns:1.5fr 1fr 1fr 1fr}.ft__a{grid-column:auto}}
.ft__pay{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:34px;padding-top:24px;border-top:1.5px solid var(--line)}
.ft__pay span{font:600 12px var(--font);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-right:6px}
.ft__pay i{font-style:normal;font-size:13px;font-weight:600;background:var(--surface-2);border-radius:8px;padding:4px 12px}
.ft__copy{margin-top:20px;font-size:13px;color:var(--muted)}
/* kerangka halaman */
.pg{padding-top:28px}.pg--narrow{max-width:860px}
.ph{margin:14px 0 26px}.ph h1{font-size:clamp(30px,4.6vw,48px);max-width:20ch;letter-spacing:-.03em}.ph__sub{color:var(--muted);margin-top:12px;max-width:54ch}
.crumbs{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--muted);flex-wrap:wrap;min-height:44px}
.crumbs a:hover{color:var(--ink)}.crumbs [aria-current]{color:var(--ink);font-weight:600}
.page-in{animation:pagein .26s ease both}
@keyframes pagein{from{opacity:0}to{opacity:1}}
@media (max-width:420px){.top__in{gap:10px}.top__r .btn svg{display:none}.top__r .btn{padding:0 14px}}
@media (max-width:360px){.logo__word span{display:none}}
/* header dua lapis (strip info + bar utama) */
.top{position:sticky;top:-34px;z-index:50}
.util{display:none;background:var(--accent);color:#fff;font-size:13px;font-weight:600}
.util__in{max-width:var(--max);margin:0 auto;height:34px;padding:0 var(--gut);display:flex;align-items:center;justify-content:space-between;gap:16px}
.util nav{display:flex;gap:18px}.util a{opacity:.92}.util a:hover{opacity:1;text-decoration:underline}
.top__in{background:var(--surface);max-width:none;padding:0 max(var(--gut),calc((100% - var(--max)) / 2 + var(--gut)))}
.top .top__cta{display:none}.top .top__tx{display:inline-flex}
@media (min-width:1024px){.util{display:block}.top .top__cta{display:inline-flex}.top .top__tx{display:none}.top__links a{min-height:68px}}

</style>
<style>
/* tombol */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 24px;border-radius:999px;font-weight:800;font-size:15px;border:1.5px solid transparent;transition:transform .12s,filter .15s,border-color .15s,background .15s;white-space:nowrap}
.btn:active{transform:scale(.98)}.btn[disabled]{opacity:.55;cursor:not-allowed}
.btn--accent{background:var(--accent);color:#fff}.btn--accent:hover{background:#86158F}
.btn--ink{background:var(--ink);color:var(--bg)}.btn--ink:hover{opacity:.9}
.btn--ghost{border-color:var(--line-strong)}.btn--ghost:hover{border-color:var(--ink)}
.btn--danger{background:var(--bad);color:#fff}
.btn--block{width:100%}.btn--sm{min-height:44px;padding:0 18px}.btn--lg{min-height:56px;padding:0 30px;font-size:16px}
/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px}
.chips button,.chip{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 18px;border-radius:999px;border:1.5px solid var(--line-strong);background:var(--surface);font-weight:700;font-size:14px;white-space:nowrap}
.chips button:hover,.chip:hover{border-color:var(--ink)}
.chips button[aria-pressed="true"],.chip.is-on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chips button span{font:500 12px var(--mono);opacity:.7}
.badge{display:inline-flex;align-items:center;padding:3px 11px;border-radius:999px;font-size:12.5px;font-weight:800;white-space:nowrap}
.badge--ok{background:var(--ok-soft);color:var(--ok)}.badge--warn{background:var(--warn-soft);color:var(--warn)}.badge--bad{background:var(--bad-soft);color:var(--bad)}.badge--info{background:var(--info-soft);color:var(--info)}.badge--mute{background:var(--surface-2);color:var(--muted)}
/* kartu */
.card{background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r-lg);padding:24px}
.card h2{font-size:19px;margin-bottom:16px}
/* form */
.fields{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}.fields--2{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:420px){.fields--2{grid-template-columns:minmax(0,1fr)}}
.field label{display:block;font-weight:700;font-size:14px;margin-bottom:6px}
.field input,.field select,.search input,.select{width:100%;min-height:50px;padding:0 16px;border-radius:var(--r-sm);border:1.5px solid var(--line-strong);background:var(--bg);font-size:16px;transition:border-color .15s}
.field input:hover,.field select:hover{border-color:var(--ink-2)}
.field input:focus,.field select:focus:focus,.search input:focus,.select:focus{outline:none;border-color:var(--violet);box-shadow:0 0 0 4px color-mix(in srgb,var(--violet) 22%,transparent)}
.field.has-err input,.field.has-err select{border-color:var(--bad)}
.field__hint{font-size:13px;color:var(--muted);margin-top:6px}
.field__err{font-size:13.5px;color:var(--bad);font-weight:700;margin-top:6px}.field__err:empty{display:none}
.op{display:inline-block;background:var(--violet);color:#fff;border-radius:999px;font-size:12px;font-weight:800;padding:1px 9px;margin-left:6px}.op[hidden]{display:none}
.select{width:auto;min-width:160px}
.search{position:relative;flex:1;min-width:0}
.search svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.search input{padding-left:46px;border-radius:999px;background:var(--surface)}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.filters .select{border-radius:999px;background:var(--surface)}
/* empty / skeleton / toast */
.empty{text-align:center;padding:64px 16px;display:flex;flex-direction:column;align-items:center;gap:10px}
.empty h1,.empty h2{font-size:24px}.empty p{color:var(--muted);max-width:42ch}
.empty__ico{width:68px;height:68px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;color:var(--muted)}
.empty__act{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:8px}
.skeleton{background:var(--surface-2);animation:skp 1.2s ease-in-out infinite}
.toasts{position:fixed;left:0;right:0;bottom:calc(var(--dock-h) + 28px + env(safe-area-inset-bottom));z-index:400;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 16px}
body.is-checkout .toasts{bottom:calc(100px + env(safe-area-inset-bottom))}
@media (min-width:1024px){.toasts{bottom:24px}}
.toast{display:flex;gap:10px;align-items:center;background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:999px;font-weight:700;font-size:14.5px;opacity:0;transform:translateY(10px);transition:.22s;max-width:100%}
.toast.is-in{opacity:1;transform:none}.toast--err{background:var(--bad);color:#fff}
/* sheet + palette */
.sheet-ov{position:fixed;inset:0;z-index:300;background:rgba(14,12,36,.6);display:flex;align-items:flex-end;justify-content:center;opacity:0;transition:opacity .2s}
.sheet-ov.is-open{opacity:1}
.sheet{background:var(--surface);width:100%;max-width:520px;max-height:90vh;display:flex;flex-direction:column;border-radius:var(--r-lg) var(--r-lg) 0 0;transform:translateY(24px);transition:transform .22s;outline:none}
.sheet-ov.is-open .sheet{transform:none}
.sheet__head{display:flex;align-items:center;justify-content:space-between;padding:18px 16px 4px 24px}.sheet__head h2{font-size:20px}
.sheet__body{padding:12px 24px 18px;overflow:auto;min-height:0}
.sheet__foot{display:flex;gap:10px;padding:14px 24px calc(18px + env(safe-area-inset-bottom));border-top:1.5px solid var(--line)}.sheet__foot .btn{flex:1}
.sheet__msg{color:var(--ink-2)}
@media (min-width:640px){.sheet-ov{align-items:center;padding:24px}.sheet{border-radius:var(--r-lg)}}
.sheet-ov--palette{align-items:flex-start;padding:8vh 12px 12px}.sheet-ov--palette .sheet{max-width:620px;border-radius:var(--r-lg)}.sheet-ov--palette .sheet__body{padding:14px}
.pal__in{display:flex;align-items:center;gap:10px;padding:0 16px;border:1.5px solid var(--line-strong);border-radius:999px;color:var(--muted)}
.pal__in input{flex:1;min-width:0;min-height:52px;border:0;background:none;outline:none;font-size:16px;color:var(--ink)}
.pal__in kbd{font-size:11px;border:1px solid var(--line-strong);border-radius:6px;padding:2px 6px}
.pal__list{margin-top:8px;max-height:52vh;overflow:auto}
.rs{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:16px;cursor:pointer;min-height:58px}
.rs.is-active,.rs:hover{background:var(--surface-2)}
.rs__ico{width:42px;height:42px;border-radius:50%;flex:none;object-fit:cover;display:grid;place-items:center}
.rs__ico--page{background:var(--surface-2);color:var(--muted)}
.rs__txt{flex:1;min-width:0;display:flex;flex-direction:column}
.rs__txt b{font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.rs__txt small{color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rs__type{font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.rs-empty{padding:18px 12px;color:var(--muted)}
.svc-ico{display:inline-grid;place-items:center;background:var(--c);color:var(--ink);flex:none;border-radius:50%}
.svc-ico svg{width:60%;height:60%}
/* faq */
.faq details{border-bottom:1.5px solid var(--line)}
.faq summary{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:18px 0;font-weight:800;cursor:pointer;list-style:none;min-height:60px}
.faq summary::-webkit-details-marker{display:none}
.faq__pm{position:relative;width:28px;height:28px;border-radius:50%;background:var(--surface-2);flex:none}
.faq__pm::before,.faq__pm::after{content:"";position:absolute;left:8px;right:8px;top:13px;height:2px;background:currentColor;border-radius:2px;transition:transform .2s}
.faq__pm::after{transform:rotate(90deg)}.faq details[open] .faq__pm::after{transform:none}.faq details[open] .faq__pm{background:var(--accent);color:var(--on-accent)}
.faq p{padding:0 0 20px;color:var(--ink-2);max-width:62ch}
/* ringkasan */
.sum{margin:0}
.sum>div{display:flex;justify-content:space-between;gap:16px;padding:10px 0;font-size:15px;border-bottom:1px solid var(--line)}
.sum dt{color:var(--muted);flex:none}.sum dd{margin:0;font-weight:700;text-align:right;overflow-wrap:anywhere;min-width:0}
.sum--tot{border-bottom:0!important;padding-top:14px!important}.sum--tot dt{color:var(--ink);font-weight:800}.sum--tot dd{font:600 22px var(--display)}
.sum--disc dd{color:var(--ok)}.sum--sheet>div:last-child{border-bottom:0}
code{background:var(--surface-2);padding:2px 8px;border-radius:8px;font-size:.92em}
.spin{width:22px;height:22px;border-radius:50%;border:3px solid var(--line-strong);border-top-color:var(--accent);animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.bill{margin-top:18px;border:1.5px dashed var(--line-strong);border-radius:var(--r);padding:16px;background:var(--bg)}
.bill__top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}

</style>
<style>
/* ===== judul seksi ===== */
.blk{margin-top:88px}
.sh{margin-bottom:26px}.sh h2,.faqwrap h2,.cta h2{font-size:clamp(24px,3.2vw,36px);letter-spacing:-.03em}.sh p{color:var(--muted);margin-top:8px;max-width:56ch}
/* ===== hero ===== */
.hero{padding-top:28px;overflow:hidden}
.hero__in{display:grid;grid-template-columns:minmax(0,1fr);gap:28px;align-items:center}
.hero__txt>*{animation:fadeUp .7s cubic-bezier(.2,.8,.2,1) both}
.hero__txt>:nth-child(2){animation-delay:.07s}.hero__txt>:nth-child(3){animation-delay:.14s}.hero__txt>:nth-child(4){animation-delay:.21s}.hero__txt>:nth-child(5){animation-delay:.28s}.hero__txt>:nth-child(6){animation-delay:.35s}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.pill{display:inline-flex;align-items:center;gap:10px;min-height:38px;padding:0 16px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:13.5px;margin-bottom:22px}
.pill i{width:9px;height:9px;border-radius:50%;background:var(--accent);animation:blink 1.8s ease-in-out infinite}
@keyframes blink{50%{box-shadow:0 0 0 6px color-mix(in srgb,var(--accent) 22%,transparent)}}
.hero h1{font-size:clamp(34px,5vw,64px);line-height:1.04;letter-spacing:-.04em;font-weight:800;text-wrap:balance}
.hl{box-shadow:inset 0 -.3em 0 var(--yellow);padding:0 .05em}
.hero__sub{margin-top:22px;max-width:50ch;color:var(--ink-2);font-size:clamp(16px,1.6vw,18.5px)}
.hero__cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}.hero__cta .btn{flex:1 1 190px}
@media (min-width:640px){.hero__cta .btn{flex:0 1 auto}}
.hero__pts{display:flex;flex-wrap:wrap;gap:10px 22px;margin-top:24px;font-weight:600;font-size:14.5px;color:var(--ink-2)}
.hero__pts li{display:inline-flex;align-items:center;gap:8px}.hero__pts svg{color:#fff;background:var(--accent);border-radius:50%;padding:4px;width:22px;height:22px}
.pricetags{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:26px}
.pricetags>span{font-size:13px;font-weight:700;color:var(--muted);margin-right:4px}
.pricetags a{display:inline-flex;flex-direction:column;padding:8px 16px;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;min-height:44px;justify-content:center;transition:border-color .15s,transform .15s}
.pricetags a:hover{border-color:var(--accent);transform:translateY(-2px)}
.pricetags a span{font-size:12px;color:var(--muted);font-weight:600}.pricetags a b{font:700 15px var(--display);color:var(--accent);font-variant-numeric:tabular-nums}
.hero__vis{min-width:0;animation:fadeUp .8s .12s cubic-bezier(.2,.8,.2,1) both}
.stage{background:#F0DDF5;border-radius:var(--r-xl);padding:20px 12px 8px;overflow:hidden}
.art{display:block;width:100%;height:auto;max-width:560px;margin:0 auto}
.art .sway{animation:sway 5s ease-in-out infinite alternate}
.art .swing{animation:swing 3.2s ease-in-out infinite alternate}
.art .fl{animation:artbob 4.5s ease-in-out infinite}
.art .tw{transform-box:fill-box;transform-origin:center;animation:tw 3s ease-in-out infinite}
@keyframes sway{from{transform:rotate(-3.5deg)}to{transform:rotate(3.5deg)}}
@keyframes swing{from{transform:rotate(-9deg)}to{transform:rotate(9deg)}}
